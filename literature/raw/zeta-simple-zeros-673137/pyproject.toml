[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta-simple-zeros-673137"
version = "1.1.0"
description = "A 67.3200117012% lower-bound candidate for simple zeros of the Riemann zeta function on the critical line"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["python-flint==0.9.0"]

[project.scripts]
zeta-673200-verify = "zeta_ext.cli:main"
zeta-673137-verify = "zeta_ext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
